version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FIREBASE_SERVICE_ACCOUNT_KEY=/app/config/firebase-key.json
      - FOOTBALL_API_KEY=${FOOTBALL_API_KEY}
      - DEBUG=True
    volumes:
      - ./config:/app/config
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - football_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - football_network

networks:
  football_network:
    driver: bridge
